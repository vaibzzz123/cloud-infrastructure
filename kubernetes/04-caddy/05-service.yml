apiVersion: v1
kind: Service
metadata:
  name: caddy-service
  namespace: caddy
spec:
  selector:
    app: caddy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard-service
  namespace: caddy
spec:
  selector:
    app: caddy
  type: NodePort
  externalTrafficPolicy: Cluster
  ports:
    - protocol: UDP
      port: 30021
      targetPort: 30021
      nodePort: 30021