apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-deployment
  namespace: caddy
  labels:
    app: caddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec: # Pod specification
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark # Required for WireGuard to work properly
            value: "1"
      initContainers:
      - name: wireguard-config-init
        image: busybox:1.37.0
        command:
          - /bin/sh
          - -ec
          - |
            install -d -o 1000 -g 1000 -m 0700 /runtime
            install -o 1000 -g 1000 -m 0600 /source/wg0.conf /runtime/wg0.conf
        volumeMounts:
        - name: wireguard-config-source
          mountPath: /source
          readOnly: true
        - name: wireguard-config-runtime
          mountPath: /runtime
      containers:
      - name: caddy
        image: caddy:2.11.4
        ports:
        - containerPort: 80 # This does NOT expose any ports, just for documentation
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m" # Millicore notation: 1000m = 1 CPU core, so can use 25% of 1 core
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet: # Probing method
            path: /
            port: 80
          initialDelaySeconds: 30 # How long to wait before starting to probe
          periodSeconds: 10 # How often to probe after initial delay
          timeoutSeconds: 5 # How long to wait for a response from container
          failureThreshold: 3 # How many consecutive failures before killing container
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: caddy-configmap
          # Note: mountPath overwrites existing directories/directory content in the container
          mountPath: /etc/caddy
          # Note: subPath is used to mount specific files
          # so it won't overwrite the entire directory
          # But not going to use it here due to Caddy docs https://hub.docker.com/_/caddy/
          # subPath: Caddyfile
      - name: wireguard
        image: lscr.io/linuxserver/wireguard:1.0.20260223
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              # - SYS_MODULE
        volumeMounts:
        - name: wireguard-pvc
          mountPath: /config
        - name: wireguard-config-runtime
          mountPath: /config/wg_confs
        ports:
        - name: wireguard-port
          protocol: UDP
          containerPort: 30021


      # ConfigMaps are added as volumes to the Pod first
      volumes:
      - name: caddy-configmap
        configMap:
          name: caddy-configmap
      - name: wireguard-pvc
        persistentVolumeClaim:
          claimName: wireguard-pvc
      - name: wireguard-config-source
        secret:
          secretName: wireguard-secret
          defaultMode: 0400
      - name: wireguard-config-runtime
        emptyDir: {}
