apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-configmap
  namespace: caddy
data:
  Caddyfile: |
    {
        auto_https off
    }

    :80 {
        @jellyfin host jellyfin.vabkapoor.com
        handle @jellyfin {
            reverse_proxy 10.90.0.2:8096
        }

        @immich host immich.vabkapoor.com
        handle @immich {
            reverse_proxy 10.90.0.2:2283
        }

        @seanime host seanime.vabkapoor.com
        handle @seanime {
            reverse_proxy 10.90.0.2:3211
        }

        @suwayomi host suwayomi.vabkapoor.com
        handle @suwayomi {
            reverse_proxy 10.90.0.2:4567
        }

        @grimmory host grimmory.vabkapoor.com
        handle @grimmory {
            reverse_proxy 10.90.0.2:6060
        }

        @romm host romm.vabkapoor.com
        handle @romm {
            reverse_proxy 10.90.0.2:8040
        }

        handle {
            respond "Hello World" 200
        }
    }
