apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-configmap
  namespace: caddy
data:
  Caddyfile: |
    {
        auto_https off
    }

    :80 {
        @jellyfin host jellyfin.vabkapoor.com
        handle @jellyfin {
            reverse_proxy homeserver.netbird.cloud:8096
        }

        @immich host immich.vabkapoor.com
        handle @immich {
            reverse_proxy homeserver.netbird.cloud:2283
        }

        @seanime host seanime.vabkapoor.com
        handle @seanime {
            reverse_proxy homeserver.netbird.cloud:3211
        }

        @suwayomi host suwayomi.vabkapoor.com
        handle @suwayomi {
            reverse_proxy homeserver.netbird.cloud:4567
        }

        handle {
            respond "Hello World" 200
        }
    }
