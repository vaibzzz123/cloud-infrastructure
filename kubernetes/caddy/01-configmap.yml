apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-configmap
data:
  Caddyfile: |
    {
        auto_https off
    }

    :80 {
        @jellyfin host jellyfin.vabkapoor.com
        handle @jellyfin {
            reverse_proxy homeserver.netbird.cloud:8096
        }

        handle {
            respond "Hello World" 200
        }
    }
