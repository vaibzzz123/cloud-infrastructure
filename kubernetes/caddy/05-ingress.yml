apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caddy-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    spec.ingressClassName: traefik
spec:
  rules:
  - host: jellyfin.vabkapoor.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: caddy-service
            port:
              number: 80
  - host: immich.vabkapoor.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: caddy-service
            port:
              number: 80
  tls:
  - hosts:
    - jellyfin.vabkapoor.com
    - immich.vabkapoor.com
    secretName: vabkapoor-com-tls
