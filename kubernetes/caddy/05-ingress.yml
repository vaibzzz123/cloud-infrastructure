apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caddy-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    spec.ingressClassName: traefik
spec:
  rules:
     - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: caddy-service
              port:
                number: 80
  tls:
  - hosts:
    - jellyfin.vabkapoor.com
    secretName: vabkapoor-com-tls
