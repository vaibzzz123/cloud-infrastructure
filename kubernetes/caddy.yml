apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-deployment
  labels:
    app: caddy
  # namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec: # Pod specification
      containers:
      - name: caddy
        image: caddy:2.11.1
        ports:
        - containerPort: 80 # This does NOT expose any ports, just for documentation    
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m" # Millicore notation: 1000m = 1 CPU core, so can use 25% of 1 core
          limits:
            memory: "1G"
            cpu: "500m"
        livenessProbe:
          httpGet: # Probing method
            path: /
            port: 80
          initialDelaySeconds: 30 # How long to wait before starting to probe
          periodSeconds: 10 # How often to probe after initial delay
          timeoutSeconds: 5 # How long to wait for a response from container
          failureThreshold: 3 # How many consecutive failures before killing container
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: caddy-configmap
          # Note: mountPath overwrites existing directories/directory content in the container
          mountPath: /etc/caddy
          # Note: subPath is used to mount specific files
          # so it won't overwrite the entire directory
          # But not going to use it here due to Caddy docs https://hub.docker.com/_/caddy/
          # subPath: Caddyfile

      # ConfigMaps are added as volumes to the Pod first
      volumes:
      - name: caddy-configmap
        configMap:
          name: caddy-configmap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-configmap
data:
  Caddyfile: |
    :80 {
        respond "Hello World" 200
    }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-service
spec:
  selector:
    app: caddy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort
