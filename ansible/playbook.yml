- name: Update packages on all hosts
  hosts: all
  tags: update-packages
  become: true
  tasks:
    - name: Update and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        lock_timeout: 600

- name: Install storage prerequisites on all hosts
  hosts: all
  tags: storage-prereqs
  become: true
  tasks:
    - name: Install Longhorn host dependencies
      ansible.builtin.apt:
        name:
          - open-iscsi # Essential for Longhorn storage
          - nfs-common # For RWX/shared volumes
          - cryptsetup # For encrypted volumes
          - util-linux # For various utilities, usually installed by default
        state: present
        update_cache: yes
        lock_timeout: 600

    - name: Enable and start iSCSI daemon
      ansible.builtin.systemd_service:
        name: iscsid
        enabled: true
        state: started

# Check out https://docs.k3s.io/installation/requirements#networking for additional info
- name: Configure firewall on all nodes
  hosts: all
  tags: firewall-all
  become: true
  tasks:
    - name: Install netfilter-persistent
      ansible.builtin.apt:
        name: netfilter-persistent
        state: present

    - name: Allow kubelet metrics port
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "10250"
        jump: ACCEPT
        action: insert
        rule_num: 1
      notify: Save iptables rules

    - name: Allow flannel VXLAN port
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        destination_port: "8472"
        jump: ACCEPT
        action: insert
        rule_num: 1
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save

- name: Configure firewall on server node
  hosts: server
  tags: firewall-server
  become: true
  tasks:
    - name: Allow k3s API server port
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "6443"
        jump: ACCEPT
        action: insert
        rule_num: 1
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save

- name: Setup k3s cluster
  tags: k3s
  ansible.builtin.import_playbook: k3s.orchestration.site

- name: Copy private kubeconfig to agent nodes
  hosts: agent
  tags: kubeconfig-agents
  gather_facts: false
  become: true
  tasks:
    - name: Read kubeconfig from server node
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ groups['server'][0] }}"
      run_once: true
      register: k3s_server_kubeconfig
      no_log: true

    - name: Ensure k3s config directory exists on agent nodes
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy kubeconfig to agent nodes with private API endpoint
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/k3s.yaml
        owner: "{{ ansible_user }}"
        group: root
        mode: "0600"
        content: >-
          {{
            k3s_server_kubeconfig.content
            | b64decode
            | regex_replace(
                'server: https://[^:]+:[0-9]+',
                'server: https://' ~ api_endpoint ~ ':' ~ (api_port | default(6443) | string)
              )
          }}
      no_log: true

# Only runs on local machine with delegate_to: 127.0.0.1, so kube config works
- name: Point local kubeconfig at public k3s API endpoint
  hosts: server
  tags: kubeconfig-local
  gather_facts: false
  tasks:
    - name: Update local kubeconfig cluster endpoint
      ansible.builtin.command:
        cmd: >
          kubectl config set-cluster {{ cluster_context | default('k3s-ansible') }}
          --server=https://{{ k3s_server_ansible_host }}:{{ api_port | default(6443) }}
      delegate_to: 127.0.0.1
      become: false
      changed_when: true

- name: Configure kubectl shell aliases on all nodes
  hosts: all
  tags: kubectl-alias
  become: true
  tasks:
    - name: Add k alias for kubectl
      ansible.builtin.lineinfile:
        path: "~{{ ansible_user }}/.bashrc"
        regexp: '^alias k='
        line: "alias k=kubectl # Added by cloud-infrastructure playbook"
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

- name: Reboot all hosts after package upgrades and k3s cluster setup
  hosts: all
  tags: reboot
  become: true
  tasks:
    - name: Reboot and wait for hosts to return
      ansible.builtin.reboot:
        msg: "Rebooting after package upgrades and k3s cluster setup"
        reboot_timeout: 600
        post_reboot_delay: 10



# To remove k3s cluster if needed.
# Will only run if explicitly called with --tags remove-k3s.
# Kept local instead of importing k3s.orchestration.reset so fact gathering can
# be disabled; setup/facts can hang on nodes with unhealthy storage mounts.
- name: Undo cluster setup
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tags:
    - never
    - remove-k3s
  tasks:
    - name: Run K3s Uninstall script [server]
      when: "'server' in group_names"
      ansible.builtin.command:
        cmd: k3s-uninstall.sh
        removes: /var/lib/rancher/k3s/*

    - name: Run K3s Uninstall script [agent]
      when: "'agent' in group_names"
      ansible.builtin.command:
        cmd: k3s-agent-uninstall.sh
        removes: /var/lib/rancher/k3s/*

    - name: Remove user kubeconfig
      ansible.builtin.file:
        path: "~{{ ansible_user }}/.kube/config"
        state: absent

    - name: Remove k3s install script
      ansible.builtin.file:
        path: /usr/local/bin/k3s-install.sh
        state: absent

    - name: Remove contents of K3s server location
      when: k3s_server_location is defined
      ansible.builtin.shell:
        cmd: "rm -rf {{ k3s_server_location }}/*"
        removes: "{{ k3s_server_location }}/*"

    - name: Remove K3s config
      when: server_config_yaml is defined
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml
        state: absent

- name: Undo user setup
  hosts: server
  gather_facts: false
  tags:
    - never
    - remove-k3s
  tasks:
    - name: Remove K3s commands from ~/.bashrc
      ansible.builtin.lineinfile:
        path: "~{{ ansible_user }}/.bashrc"
        search_string: "Added by k3s-ansible"
        state: absent
