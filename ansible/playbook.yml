- name: Update packages on all hosts
  hosts: all
  tags: update-packages
  become: true
  tasks:
    - name: Update and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        lock_timeout: 600

# Check out https://docs.k3s.io/installation/requirements#networking for additional info
- name: Configure firewall on all nodes
  hosts: all
  tags: firewall-all
  become: true
  tasks:
    - name: Install netfilter-persistent
      ansible.builtin.apt:
        name: netfilter-persistent
        state: present

    - name: Allow kubelet metrics port
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "10250"
        jump: ACCEPT
        action: insert
        rule_num: 1
      notify: Save iptables rules

    - name: Allow flannel VXLAN port
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        destination_port: "8472"
        jump: ACCEPT
        action: insert
        rule_num: 1
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save

- name: Configure firewall on server node
  hosts: server
  tags: firewall-server
  become: true
  tasks:
    - name: Allow k3s API server port
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "6443"
        jump: ACCEPT
        action: insert
        rule_num: 1
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save

- name: Setup k3s cluster
  tags: k3s
  ansible.builtin.import_playbook: k3s.orchestration.site

