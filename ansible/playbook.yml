- name: Update packages on all k3s hosts
  hosts: k3s_cluster
  gather_facts: false
  tags: update-packages
  become: true
  tasks:
    - name: Update and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        lock_timeout: 600

- name: Install storage prerequisites on all k3s hosts
  hosts: k3s_cluster
  gather_facts: false
  tags: storage-prereqs
  become: true
  tasks:
    - name: Install Longhorn host dependencies
      ansible.builtin.apt:
        name:
          - open-iscsi # Essential for Longhorn storage
          - nfs-common # For RWX/shared volumes
          - cryptsetup # For encrypted volumes
          - util-linux # For various utilities, usually installed by default
        state: present
        update_cache: yes
        lock_timeout: 600

    - name: Enable and start iSCSI daemon
      ansible.builtin.systemd_service:
        name: iscsid
        enabled: true
        state: started

- name: Install and connect NetBird on all k3s hosts
  hosts: k3s_cluster
  gather_facts: false
  tags: netbird
  become: true
  tasks:
    - name: Ensure NetBird setup key is configured
      ansible.builtin.assert:
        that:
          - netbird_k3s_nodes_setup_key is defined
          - netbird_k3s_nodes_setup_key | default('') | length > 0
        fail_msg: "Set netbird_k3s_nodes_setup_key in ansible/group_vars/all/secrets.yml before running the NetBird play."
        quiet: true

    - name: Install NetBird apt repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
          - python3-apt
        state: present
        update_cache: yes
        lock_timeout: 600

    - name: Add NetBird apt signing key
      ansible.builtin.get_url:
        url: https://pkgs.netbird.io/debian/public.key
        dest: /usr/share/keyrings/netbird.asc
        owner: root
        group: root
        mode: "0644"

    - name: Add NetBird apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/netbird.asc] https://pkgs.netbird.io/debian stable main"
        filename: netbird
        state: present
        update_cache: true

    - name: Install NetBird
      ansible.builtin.apt:
        name: netbird
        state: present
        lock_timeout: 600

    - name: Check whether NetBird service is installed
      ansible.builtin.command:
        cmd: systemctl cat netbird.service
      register: netbird_service_unit
      changed_when: false
      failed_when: false

    - name: Install NetBird service
      ansible.builtin.command:
        cmd: netbird service install
      when: netbird_service_unit.rc != 0

    - name: Enable and start NetBird service
      ansible.builtin.systemd_service:
        name: netbird
        enabled: true
        state: started
        daemon_reload: true

    - name: Check whether NetBird is already enrolled
      ansible.builtin.stat:
        path: /var/lib/netbird/config.json
      register: netbird_config

    - name: Connect NetBird with inventory hostname
      ansible.builtin.command:
      # inventory_hostname is an ansible special variable that contains the name of the host as defined in the inventory.
        argv: "{{ ['netbird', 'up', '--setup-key', netbird_k3s_nodes_setup_key, '--hostname', inventory_hostname] }}"
      # from above step
      when: not netbird_config.stat.exists
      no_log: true

- name: Apply host hardening
  ansible.builtin.import_playbook: playbooks/02-host-hardening.yml

# Check out https://docs.k3s.io/installation/requirements#networking for additional info
- name: Configure firewall on all k3s nodes
  hosts: k3s_cluster
  gather_facts: false
  tags: firewall-all
  become: true
  vars:
    k3s_kubelet_allowed_cidrs:
      - "{{ k3s_vcn_cidr }}"
      - "{{ k3s_pod_cidr }}"
      - "{{ k3s_service_cidr }}"
  tasks:
    - name: Ensure firewall CIDRs are configured
      ansible.builtin.assert:
        that:
          - k3s_vcn_cidr is defined
          - k3s_vcn_cidr | length > 0
          - k3s_pod_cidr is defined
          - k3s_pod_cidr | length > 0
          - k3s_service_cidr is defined
          - k3s_service_cidr | length > 0
        fail_msg: "Set k3s_vcn_cidr, k3s_pod_cidr, and k3s_service_cidr before running firewall tasks."
        quiet: true

    - name: Install netfilter-persistent
      ansible.builtin.apt:
        name: netfilter-persistent
        state: present

    - name: Allow kubelet metrics port from cluster CIDRs
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        source: "{{ item }}"
        destination_port: "10250"
        jump: ACCEPT
        action: insert
        rule_num: 1
        comment: "Allow k3s kubelet metrics from {{ item }}"
      loop: "{{ k3s_kubelet_allowed_cidrs }}"
      notify: Save iptables rules

    - name: Allow flannel VXLAN port from VCN
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        source: "{{ k3s_vcn_cidr }}"
        destination_port: "8472"
        jump: ACCEPT
        action: insert
        rule_num: 1
        comment: "Allow k3s flannel VXLAN from VCN"
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save

- name: Configure firewall on server node
  hosts: server
  gather_facts: false
  tags: firewall-server
  become: true
  vars:
    k3s_api_internal_cidrs:
      - "{{ k3s_vcn_cidr }}"
      - "{{ k3s_pod_cidr }}"
      - "{{ k3s_service_cidr }}"
  tasks:
    - name: Ensure API firewall CIDRs are configured
      ansible.builtin.assert:
        that:
          - k3s_vcn_cidr is defined
          - k3s_vcn_cidr | length > 0
          - k3s_pod_cidr is defined
          - k3s_pod_cidr | length > 0
          - k3s_service_cidr is defined
          - k3s_service_cidr | length > 0
          - k3s_api_trusted_cidrs is defined
          - k3s_api_trusted_cidrs | length > 0
        fail_msg: "Set k3s_vcn_cidr, k3s_pod_cidr, k3s_service_cidr, and k3s_api_trusted_cidrs before running server firewall tasks."
        quiet: true

    - name: Allow k3s API server port from internal cluster CIDRs
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        source: "{{ item }}"
        destination_port: "6443"
        jump: ACCEPT
        action: insert
        rule_num: 1
        comment: "Allow k3s API from {{ item }}"
      loop: "{{ k3s_api_internal_cidrs }}"
      notify: Save iptables rules

    - name: Allow k3s API server port from trusted public CIDRs
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        source: "{{ item }}"
        destination_port: "6443"
        jump: ACCEPT
        action: insert
        rule_num: 1
        comment: "Allow k3s API from trusted public CIDR {{ item }}"
      loop: "{{ k3s_api_trusted_cidrs }}"
      notify: Save iptables rules

  handlers:
    - name: Save iptables rules
      ansible.builtin.command: netfilter-persistent save

- name: Configure k3s server audit policy
  hosts: server
  gather_facts: false
  tags:
    - k3s
    - k3s-security
  become: true
  tasks:
    - name: Ensure k3s audit directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ k3s_audit_policy_path | dirname }}"
        - "{{ k3s_audit_log_dir }}"

    - name: Configure k3s audit policy
      ansible.builtin.copy:
        dest: "{{ k3s_audit_policy_path }}"
        owner: root
        group: root
        mode: "0600"
        content: |
          apiVersion: audit.k8s.io/v1
          kind: Policy
          rules:
            - level: Metadata

- name: Setup k3s cluster
  tags: k3s
  ansible.builtin.import_playbook: k3s.orchestration.site

- name: Install daily k3s cluster backups
  ansible.builtin.import_playbook: playbooks/03-cluster-backup-restore.yml

- name: Configure limited kubectl access on agent nodes
  hosts: agent
  tags: kubeconfig-agents
  gather_facts: false
  become: true
  vars:
    agent_diagnostics_namespace: kube-system
    agent_diagnostics_service_account: agent-diagnostics
    agent_diagnostics_context: agent-diagnostics
    agent_diagnostics_token_duration: "8760h" # 1 year, will need to refresh token before then
    agent_diagnostics_kubeconfig_path: "~{{ ansible_user }}/.kube/config"
  tasks:
    - name: Wait for diagnostics ServiceAccount
      ansible.builtin.command:
        cmd: >
          k3s kubectl -n {{ agent_diagnostics_namespace }}
          get serviceaccount {{ agent_diagnostics_service_account }}
      delegate_to: "{{ groups['server'][0] }}"
      run_once: true
      register: agent_diagnostics_service_account_check
      retries: 12
      delay: 5
      until: agent_diagnostics_service_account_check.rc == 0
      changed_when: false

    - name: Wait for diagnostics ClusterRoleBinding
      ansible.builtin.command:
        cmd: k3s kubectl get clusterrolebinding agent-diagnostics-readonly
      delegate_to: "{{ groups['server'][0] }}"
      run_once: true
      register: agent_diagnostics_clusterrolebinding_check
      retries: 12
      delay: 5
      until: agent_diagnostics_clusterrolebinding_check.rc == 0
      changed_when: false

    - name: Check limited kubeconfig on agent nodes
      ansible.builtin.stat:
        path: "{{ agent_diagnostics_kubeconfig_path }}"
      register: agent_diagnostics_kubeconfig

    - name: Ensure user kubeconfig directory exists on agent nodes
      ansible.builtin.file:
        path: "~{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Create initial limited kubeconfig on agent nodes
      when: not agent_diagnostics_kubeconfig.stat.exists
      no_log: true
      block:
        - name: Read cluster CA data
          ansible.builtin.command:
            cmd: >
              k3s kubectl config view --raw
              -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
          delegate_to: "{{ groups['server'][0] }}"
          register: k3s_cluster_ca_data
          changed_when: false

        - name: Create diagnostics ServiceAccount token
          ansible.builtin.command:
            cmd: >
              k3s kubectl -n {{ agent_diagnostics_namespace }}
              create token {{ agent_diagnostics_service_account }}
              --duration={{ agent_diagnostics_token_duration }}
          delegate_to: "{{ groups['server'][0] }}"
          register: agent_diagnostics_token
          changed_when: false

        - name: Ensure limited kubeconfig values were created
          ansible.builtin.assert:
            that:
              - k3s_cluster_ca_data.stdout | length > 0
              - agent_diagnostics_token.stdout | length > 0
            fail_msg: "Failed to build the limited agent kubeconfig."
            quiet: true

        - name: Copy limited kubeconfig to agent nodes
          ansible.builtin.copy:
            dest: "{{ agent_diagnostics_kubeconfig_path }}"
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
                - name: k3s
                  cluster:
                    server: https://{{ api_endpoint }}:{{ api_port | default(6443) }}
                    certificate-authority-data: {{ k3s_cluster_ca_data.stdout }}
              users:
                - name: {{ agent_diagnostics_service_account }}
                  user:
                    token: {{ agent_diagnostics_token.stdout }}
              contexts:
                - name: {{ agent_diagnostics_context }}
                  context:
                    cluster: k3s
                    user: {{ agent_diagnostics_service_account }}
              current-context: {{ agent_diagnostics_context }}

- name: Refresh limited kubectl token on agent nodes
  hosts: agent
  tags:
    - never
    - agent-token-refresh
  gather_facts: false
  become: true
  vars:
    agent_diagnostics_namespace: kube-system
    agent_diagnostics_service_account: agent-diagnostics
    agent_diagnostics_context: agent-diagnostics
    agent_diagnostics_token_duration: "8760h" # 1 year, will need to refresh token before then
    agent_diagnostics_kubeconfig_path: "~{{ ansible_user }}/.kube/config"
  tasks:
    - name: Wait for diagnostics ServiceAccount
      ansible.builtin.command:
        cmd: >
          k3s kubectl -n {{ agent_diagnostics_namespace }}
          get serviceaccount {{ agent_diagnostics_service_account }}
      delegate_to: "{{ groups['server'][0] }}"
      run_once: true
      register: agent_diagnostics_service_account_check
      retries: 12
      delay: 5
      until: agent_diagnostics_service_account_check.rc == 0
      changed_when: false

    - name: Wait for diagnostics ClusterRoleBinding
      ansible.builtin.command:
        cmd: k3s kubectl get clusterrolebinding agent-diagnostics-readonly
      delegate_to: "{{ groups['server'][0] }}"
      run_once: true
      register: agent_diagnostics_clusterrolebinding_check
      retries: 12
      delay: 5
      until: agent_diagnostics_clusterrolebinding_check.rc == 0
      changed_when: false

    - name: Read cluster CA data
      ansible.builtin.command:
        cmd: >
          k3s kubectl config view --raw
          -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'
      delegate_to: "{{ groups['server'][0] }}"
      register: k3s_cluster_ca_data
      changed_when: false

    - name: Create diagnostics ServiceAccount token
      ansible.builtin.command:
        cmd: >
          k3s kubectl -n {{ agent_diagnostics_namespace }}
          create token {{ agent_diagnostics_service_account }}
          --duration={{ agent_diagnostics_token_duration }}
      delegate_to: "{{ groups['server'][0] }}"
      register: agent_diagnostics_token
      changed_when: false
      no_log: true

    - name: Ensure limited kubeconfig values were created
      ansible.builtin.assert:
        that:
          - k3s_cluster_ca_data.stdout | length > 0
          - agent_diagnostics_token.stdout | length > 0
        fail_msg: "Failed to refresh the limited agent kubeconfig."
        quiet: true
      no_log: true

    - name: Ensure user kubeconfig directory exists on agent nodes
      ansible.builtin.file:
        path: "~{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Refresh limited kubeconfig on agent nodes
      ansible.builtin.copy:
        dest: "{{ agent_diagnostics_kubeconfig_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: k3s
              cluster:
                server: https://{{ api_endpoint }}:{{ api_port | default(6443) }}
                certificate-authority-data: {{ k3s_cluster_ca_data.stdout }}
          users:
            - name: {{ agent_diagnostics_service_account }}
              user:
                token: {{ agent_diagnostics_token.stdout }}
          contexts:
            - name: {{ agent_diagnostics_context }}
              context:
                cluster: k3s
                user: {{ agent_diagnostics_service_account }}
          current-context: {{ agent_diagnostics_context }}
      no_log: true

# Only runs on local machine with delegate_to: 127.0.0.1, so kube config works
- name: Point local kubeconfig at public k3s API endpoint
  hosts: server
  tags: kubeconfig-local
  gather_facts: false
  tasks:
    - name: Update local kubeconfig cluster endpoint
      ansible.builtin.command:
        cmd: >
          kubectl config set-cluster {{ cluster_context | default('k3s-ansible') }}
          --server=https://{{ k3s_server_ansible_host }}:{{ api_port | default(6443) }}
      delegate_to: 127.0.0.1
      become: false
      changed_when: true

- name: Configure kubectl shell aliases on all k3s nodes
  hosts: k3s_cluster
  gather_facts: false
  tags: kubectl-alias
  become: true
  tasks:
    - name: Add k alias for kubectl
      ansible.builtin.lineinfile:
        path: "~{{ ansible_user }}/.bashrc"
        regexp: '^alias k='
        line: "alias k=kubectl # Added by cloud-infrastructure playbook"
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

- name: Reboot all k3s hosts after package upgrades and cluster setup
  hosts: k3s_cluster
  gather_facts: false
  tags: reboot
  become: true
  tasks:
    - name: Reboot and wait for hosts to return
      ansible.builtin.reboot:
        msg: "Rebooting after package upgrades and k3s cluster setup"
        reboot_timeout: 600
        post_reboot_delay: 10



# To remove k3s cluster if needed.
# Will only run if explicitly called with --tags remove-k3s.
# Kept local instead of importing k3s.orchestration.reset so fact gathering can
# be disabled; setup/facts can hang on nodes with unhealthy storage mounts.
- name: Undo cluster setup
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tags:
    - never
    - remove-k3s
  tasks:
    - name: Check for K3s server uninstall script
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: k3s_server_uninstall_script
      when: "'server' in group_names"

    - name: Check for K3s agent uninstall script
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: k3s_agent_uninstall_script
      when: "'agent' in group_names"

    - name: Check for K3s killall script
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-killall.sh
      register: k3s_killall_script

    - name: Stop K3s runtime processes and mounts
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-killall.sh
      when: k3s_killall_script.stat.exists
      changed_when: true

    - name: Stop K3s services before removing partial state
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - k3s
        - k3s-agent
      failed_when: false

    - name: Run K3s Uninstall script [server]
      when:
        - "'server' in group_names"
        - k3s_server_uninstall_script.stat.exists
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-uninstall.sh
        removes: /usr/local/bin/k3s-uninstall.sh

    - name: Run K3s Uninstall script [agent]
      when:
        - "'agent' in group_names"
        - k3s_agent_uninstall_script.stat.exists
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-agent-uninstall.sh
        removes: /usr/local/bin/k3s-agent-uninstall.sh

    - name: Remove user kubeconfig
      ansible.builtin.file:
        path: "~{{ ansible_user }}/.kube/config"
        state: absent

    - name: Remove K3s installers, binaries, and service files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/k3s-install.sh
        - /usr/local/bin/k3s
        - /usr/local/bin/kubectl
        - /usr/local/bin/crictl
        - /usr/local/bin/ctr
        - /usr/local/bin/k3s-killall.sh
        - /usr/local/bin/k3s-uninstall.sh
        - /usr/local/bin/k3s-agent-uninstall.sh
        - /etc/systemd/system/k3s.service
        - /etc/systemd/system/k3s.service.env
        - /etc/systemd/system/k3s-agent.service
        - /etc/systemd/system/k3s-agent.service.env

    - name: Remove K3s, CNI, and Longhorn state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rancher/k3s
        - /var/lib/rancher/k3s
        - /var/lib/kubelet
        - /var/lib/cni
        - /etc/cni/net.d
        - /var/lib/longhorn

    - name: Reload systemd after removing K3s service files
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Undo user setup
  hosts: server
  gather_facts: false
  tags:
    - never
    - remove-k3s
  tasks:
    - name: Remove K3s commands from ~/.bashrc
      ansible.builtin.lineinfile:
        path: "~{{ ansible_user }}/.bashrc"
        search_string: "Added by k3s-ansible"
        state: absent
