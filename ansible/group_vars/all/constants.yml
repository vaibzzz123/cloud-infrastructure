k3s_vcn_cidr: "10.0.0.0/16"
k3s_pod_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_server_netbird_hostname: "k3s-server.netbird.cloud"

k3s_audit_policy_path: "/var/lib/rancher/k3s/server/audit.yaml"
k3s_audit_log_dir: "/var/lib/rancher/k3s/server/logs"
k3s_audit_log_path: "{{ k3s_audit_log_dir }}/audit.log"

k3s_backup_root: "/var/backups/k3s-cluster"
k3s_backup_retention_count: 3
k3s_backup_calendar: "daily"

fail2ban_ignore_cidrs: "{{ ['127.0.0.1/8', '::1'] + (k3s_api_trusted_cidrs | default([])) }}"
