k3s_cluster:
  children:
    server:
      hosts:
        k3s-server:
          ansible_host: "{{ k3s_server_ansible_host }}"
          ansible_user: "{{ k3s_server_ansible_user }}"
          ansible_ssh_private_key_file: "{{ k3s_server_ansible_ssh_private_key_file }}"
    agent:
      hosts:
        k3s-agent-1:
          ansible_host: "{{ k3s_agent_1_ansible_host }}"
          ansible_user: "{{ k3s_agent_1_ansible_user }}"
          ansible_ssh_private_key_file: "{{ k3s_agent_1_ansible_ssh_private_key_file }}"
        k3s-agent-2:
          ansible_host: "{{ k3s_agent_2_ansible_host }}"
          ansible_user: "{{ k3s_agent_2_ansible_user }}"
          ansible_ssh_private_key_file: "{{ k3s_agent_2_ansible_ssh_private_key_file }}"

  # Required Vars
  vars:
    # ansible_port: 22
    # ansible_user: debian
    k3s_version: "v1.35.1+k3s1"
    # The token should be a random string of reasonable length. You can generate
    # one with the following commands:
    # - openssl rand -base64 64
    # - pwgen -s 64 1
    # Keep this value in the untracked group_vars/all/secrets.yml file.
    # Ansible loads it automatically with the rest of the all group vars.
    token: "{{ k3s_token }}"
    # Overwrote default api endpoint as private ip within the VCN is required for it to not hang on final k3s install step
    api_endpoint: "{{ k3s_server_private_ip }}"


    # Optional vars
    # extra_server_args: ""
    # extra_agent_args: ""
    # extra_install_envs: { 'INSTALL_K3S_SKIP_SELINUX_RPM': 'true' }
    # cluster_context: k3s-ansible
    # api_port: 6443
    # k3s_server_location: /var/lib/rancher/k3s
    # systemd_dir: /etc/systemd/system
    # extra_service_envs: [ 'ENV_VAR1=VALUE1', 'ENV_VAR2=VALUE2' ]
    # user_kubectl: true, by default kubectl is symlinked and configured for use by ansible_user. Set to false to only kubectl via root user.

    # Manifests or Airgap should be either full paths or relative to the playbook directory.
    # List of locally available manifests to apply to the cluster, useful for PVCs or Traefik modifications.
    # extra_manifests: [ '/path/to/manifest1.yaml', '/path/to/manifest2.yaml' ]
    extra_manifests:
      - "{{ inventory_dir }}/files/agent-diagnostics-rbac.yml"
    # airgap_dir: /tmp/k3s-airgap-images

    server_config_yaml:  |
      secrets-encryption: true
      kube-apiserver-arg:
        - "audit-log-path={{ k3s_audit_log_path }}"
        - "audit-policy-file={{ k3s_audit_policy_path }}"
        - "audit-log-maxage=30"
        - "audit-log-maxbackup=10"
        - "audit-log-maxsize=100"
      tls-san:
        - "{{ k3s_server_ansible_host }}"
        - "{{ k3s_server_netbird_hostname }}"
    #   This is now an inner yaml file. Maintain the indentation.
    #   YAML here will be placed as the content of /etc/rancher/k3s/config.yaml
    #   See https://docs.k3s.io/installation/configuration#configuration-file
    # agent_config_yaml:  |
    #   Same as server_config_yaml, but for the agent nodes.
    #   YAML here will be placed as the content of /etc/rancher/k3s/config.yaml
    #   See https://docs.k3s.io/installation/configuration#configuration-file
    # registries_config_yaml:  |
    #   Containerd can be configured to connect to private registries and use them to pull images as needed by the kubelet.
    #   YAML here will be placed as the content of /etc/rancher/k3s/registries.yaml
    #   See https://docs.k3s.io/installation/private-registry
