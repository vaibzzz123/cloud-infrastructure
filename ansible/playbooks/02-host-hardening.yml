- name: Harden SSH on all k3s nodes
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tags:
    - host-hardening
    - ssh-hardening
  tasks:
    - name: Ensure sshd config drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure SSH hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-cloud-infrastructure-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          MaxAuthTries 3
          LoginGraceTime 30
      notify:
        - Validate ssh config
        - Reload ssh

  handlers:
    - name: Validate ssh config
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

    - name: Reload ssh
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

- name: Configure Fail2Ban for SSH on all k3s nodes
  hosts: k3s_cluster
  gather_facts: false
  become: true
  tags:
    - host-hardening
    - fail2ban-hardening
  vars:
    fail2ban_sshd_maxretry: 5
    fail2ban_sshd_findtime: "10m"
    fail2ban_sshd_bantime: "10m"
    fail2ban_sshd_bantime_multipliers:
      - 1
      - 6
      - 24
      - 144
    fail2ban_sshd_bantime_maxtime: "24h"
  tasks:
    - name: Install Fail2Ban
      ansible.builtin.apt:
        name:
          - fail2ban
          - python3-systemd
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600

    - name: Ensure Fail2Ban jail config directory exists
      ansible.builtin.file:
        path: /etc/fail2ban/jail.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Fail2Ban sshd jail
      ansible.builtin.template:
        src: ../templates/fail2ban-sshd.local.j2
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
      notify:
        - Validate fail2ban config
        - Restart fail2ban

    - name: Enable and start Fail2Ban
      ansible.builtin.systemd_service:
        name: fail2ban
        enabled: true
        state: started

  handlers:
    - name: Validate fail2ban config
      ansible.builtin.command:
        cmd: fail2ban-client -t
      changed_when: false

    - name: Restart fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted
